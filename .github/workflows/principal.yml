name: Test workflow

on:
  push:
    branches:
      - main

jobs:
  test_job:
    name: Executando o job de teste
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório
      - name: Checkout
        uses: actions/checkout@v6

      # Configura o Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Autentica no Docker Hub
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: pedroaalbuquerq
          password: ${{ secrets.DOCKERHUB_ACCESS }}

      # Build e publicação da imagem
      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: pedroaalbuquerq/fiap-ghactions:latest
