#Define o nome do workflow
name: Test workflow

#Define quando o workflow será disparado
on:
  push:
    branches:
      - main

jobs:
  test_job:
    name: Executando o job de teste
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        uses: actions/checkout@v2

      - name: Docker Login
        uses: docker/login-action@v4.7.0
        with:
          username: 'pedroaalbuquerq'
          password: ${{secrets.DOCKERHUBACESS}}
      - name: Build and push Docker images
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          tags: 'latest'
          push: true

